# Builds the HostPilot Android app and publishes it as the "android-latest" GitHub release
# (download URL: https://github.com/<owner>/<repo>/releases/download/android-latest/HostPilot.apk).
#
# Signing: add these repository secrets (Settings → Secrets and variables → Actions) so every build
# is signed with the same key and installs as an update. Without them the APK is signed with a
# throw-away debug key and you must uninstall the old app before installing a new build.
#   ANDROID_KEYSTORE_BASE64    base64 of the .jks file
#   ANDROID_KEYSTORE_PASSWORD  keystore (and key) password
#   ANDROID_KEY_ALIAS          key alias (default: hostpilot)
name: Android app

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/hostpilot.jks"
            echo "HOSTPILOT_KEYSTORE=$RUNNER_TEMP/hostpilot.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with a debug key. Each build will need the old app uninstalled first."
          fi

      - name: Build APK
        working-directory: android
        env:
          HOSTPILOT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HOSTPILOT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle --no-daemon assembleRelease

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk HostPilot.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HostPilot-android
          path: HostPilot.apk

      - name: Publish release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="HostPilot for Android, build ${{ github.run_number }} ($(git rev-parse --short HEAD)). Install on the phone, then enter your HostPilot server address."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest HostPilot.apk --clobber
            gh release edit android-latest --notes "$notes"
          else
            gh release create android-latest HostPilot.apk --title "HostPilot Android app" --notes "$notes" --latest=false
          fi
