plugins {
    id 'com.android.application'
}

// CI sets GITHUB_RUN_NUMBER so every build installs as an upgrade over the previous one.
def buildNumber = Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
def keystorePath = System.getenv('HOSTPILOT_KEYSTORE')

android {
    namespace 'com.hostpilot.rmm'
    compileSdk 34

    defaultConfig {
        applicationId 'com.hostpilot.rmm'
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('HOSTPILOT_KEYSTORE_PASSWORD')
                keyAlias System.getenv('HOSTPILOT_KEY_ALIAS') ?: 'hostpilot'
                keyPassword System.getenv('HOSTPILOT_KEY_PASSWORD') ?: System.getenv('HOSTPILOT_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Without a release key (see README) the APK is signed with the debug key so it still installs.
            signingConfig keystorePath ? signingConfigs.release : signingConfigs.debug
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
